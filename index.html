<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cookbook Club</title>
<meta name="robots" content="noindex">
<script>try{var t=localStorage.getItem("ci-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wdth,wght@62..125,300..900&family=Faculty+Glyphic&family=IBM+Plex+Mono:wght@400;600&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#111214; --ink2:#55585e; --ink3:#9a9da3; --rule:#e3e4e7; --paper:#ffffff; --wash:#f3f4f6;
    --hot:#ff876d; --hotwash:#ffece7; --on-hot:#111214;
    --sans:"Archivo", system-ui, sans-serif; --mono:"IBM Plex Mono", ui-monospace, monospace;
    --pad:20px; --on-ink:#ffffff; --ph:#c9cbd0; --sheet:#ffffff;
    color-scheme:light;
  }
  /* dark: follows the phone unless the toggle forces a mode */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme=light]){
      --ink:#eceef1; --ink2:#a3a7af; --ink3:#6d7179; --rule:#2b2d32; --paper:#121316; --wash:#1c1e22;
      --hot:#ff876d; --hotwash:#3b211b; --on-ink:#121316; --ph:#3a3d43; --sheet:#1d1f23; color-scheme:dark;
    }
  }
  :root[data-theme=dark]{
    --ink:#eceef1; --ink2:#a3a7af; --ink3:#6d7179; --rule:#2b2d32; --paper:#121316; --wash:#1c1e22;
    --hot:#ff876d; --hotwash:#3b211b; --on-ink:#121316; --ph:#3a3d43; --sheet:#1d1f23; color-scheme:dark;
  }
  :root[data-theme=dark] .ph, :root:not([data-theme=light]) .ph{outline:1px solid var(--rule);outline-offset:-1px}
  @media (prefers-color-scheme: light){ :root:not([data-theme=dark]) .ph{outline:0} }
  .themebtn{border:1px solid var(--rule);background:none;color:var(--ink2);width:30px;height:30px;padding:0;margin-left:12px;display:grid;place-items:center;flex:none}
  .themebtn svg{width:18px;height:18px}
  .brand{white-space:nowrap;color:inherit;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .mast{align-items:center}
  @media (max-width:440px){ .mast .stats{display:none} }
  .sheet{box-shadow:0 -8px 30px rgba(0,0,0,.25)}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;-webkit-font-smoothing:antialiased}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 96px) env(safe-area-inset-left)}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  .wrap{max-width:760px;margin:0 auto;padding:0 var(--pad)}

  header{padding-top:28px}
  .mast{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .brand{font-weight:800;font-stretch:72%;font-size:15px;letter-spacing:.14em;text-transform:uppercase}
  .brand b{color:var(--hot)}
  .stats{font-family:var(--mono);font-size:12px;color:var(--ink2);white-space:nowrap}

  .searchbox{position:relative;margin-top:22px}
  .searchbox input{width:100%;border:0;border-bottom:3px solid var(--ink);padding:6px 40px 10px 0;font-size:clamp(26px,7vw,52px);font-weight:700;font-stretch:78%;letter-spacing:-.01em;background:transparent;outline:none;border-radius:0}
  .searchbox input::-webkit-search-cancel-button{display:none;-webkit-appearance:none}
  .searchbox input::placeholder{color:var(--ph)}
  .searchbox input:focus{border-bottom-color:var(--hot)}
  .searchbox .clear{position:absolute;right:0;bottom:14px;border:0;background:var(--wash);width:30px;height:30px;border-radius:50%;font-size:18px;line-height:1;display:none}
  .searchbox.has .clear{display:block}

  nav.tabs{display:flex;gap:22px;margin-top:18px;border-bottom:1px solid var(--rule)}
  nav.tabs button{border:0;background:none;padding:10px 0;font-weight:700;font-stretch:85%;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);border-bottom:3px solid transparent;margin-bottom:-1px}
  nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}

  .note{font-size:14px;color:var(--ink2);margin:14px 0 0}
  .banner{margin-top:14px;padding:10px 12px;background:var(--hotwash);font-size:14px;border-left:3px solid var(--hot)}

  ul.list{list-style:none;margin:0;padding:0}
  .row{display:grid;grid-template-columns:1fr auto;gap:2px 16px;align-items:end;padding:14px 0;border-bottom:1px solid var(--rule);cursor:pointer}
  .row:active{background:var(--wash)}
  .row .t{font-size:19px;font-weight:600;font-stretch:92%;line-height:1.2}
  .row .t mark{background:none;color:var(--hot)}
  .row .b{grid-column:1;font-size:13px;color:var(--ink2);letter-spacing:.01em}
  .row .p{grid-row:1 / span 2;grid-column:2;font-family:var(--mono);font-weight:600;font-size:22px;text-align:right;align-self:center}
  .row .p small{display:block;font-size:10px;font-weight:400;color:var(--ink3);letter-spacing:.1em}
  .row .via{color:var(--hot)}
  .row .mk{grid-column:1;font-family:var(--mono);font-size:11px;color:var(--ink2);margin-top:2px}
  .hot{color:var(--hot)}
  .stars{display:flex;gap:2px}
  .stars button{border:0;background:none;font-size:28px;line-height:1;padding:2px 3px;color:var(--ink3);cursor:pointer}
  .stars button.on{color:var(--hot)}
  .stars button:disabled{cursor:default}
  .rate-row{display:flex;align-items:center;gap:12px;margin:10px 0 4px}
  .rate-row > span{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);min-width:92px}
  .rate-row.ask > span{color:var(--hot)}
  .shelfseg{margin:16px 0 0;max-width:320px}
  .lnk{border:0;background:none;padding:0;color:inherit;text-decoration:underline;text-underline-offset:3px;font:inherit;cursor:pointer}
  .rp{padding:14px 0 30px}
  .rp h1{font-weight:800;font-stretch:72%;font-size:clamp(36px,10vw,58px);line-height:.96;letter-spacing:-.01em;margin:10px 0 18px}
  .where{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:stretch}
  .pgbox{border:3px solid var(--ink);padding:8px 14px;font-family:var(--mono);font-weight:600;font-size:44px;line-height:1;text-align:center;display:flex;flex-direction:column;justify-content:center}
  .pgbox small{font-size:10px;font-weight:400;letter-spacing:.14em;color:var(--ink2);margin-bottom:4px}
  .where .bk{display:flex;gap:12px;align-items:center;border:0;background:var(--wash);padding:10px;text-align:left;cursor:pointer}
  .where .mini{width:46px;flex:none}
  .where .mini .ph{padding:5px}.where .mini .ph b{font-size:7px}.where .mini .ph i{display:none}
  .where b{display:block;font-weight:700;font-stretch:88%;font-size:16px;line-height:1.15}
  .where i{display:block;font-style:normal;font-size:13px;color:var(--ink2);margin-top:2px}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 6px}
  .acts button{display:flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--paper);padding:13px 10px;font-weight:700;font-size:15px}
  .acts button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
  .acts button.done{background:var(--ink);color:var(--on-ink)}
  .cookedline{font-family:var(--mono);font-size:12px;color:var(--ink2);margin:6px 0}
  .rp section{margin-top:26px}
  .rp h3{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;border-bottom:3px solid var(--ink);padding-bottom:6px;margin:0 0 10px}
  .ing{list-style:none;padding:0;margin:0;columns:2;column-gap:24px}
  .ing li{padding:7px 0;border-bottom:1px solid var(--rule);break-inside:avoid;font-size:16px}
  @media (max-width:360px){.ing{columns:1}}
  .tagset{display:flex;flex-wrap:wrap;gap:8px}
  .tg{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--ink);padding:5px 6px 5px 10px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.05em}
  .tg .lnk{text-decoration:none}
  .tg .x{border:0;background:none;font-size:16px;line-height:1;color:var(--ink3);padding:0 2px;cursor:pointer}
  .tg.g{border-style:dashed;border-color:var(--ink3);color:var(--ink2)}
  .addtag{display:flex;gap:8px;margin-top:12px;align-items:flex-start}.tagin{position:relative;flex:1;min-width:0}.tagin .in{width:100%}
  .tagsug{position:absolute;left:0;right:0;top:100%;z-index:20;margin:4px 0 0;padding:4px 0;list-style:none;background:var(--sheet,var(--bg));border:2px solid var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.18)}
  .tagsug li{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 12px;font-size:15px;cursor:pointer}
  .tagsug li b{font-weight:700}.tagsug li small{font-family:var(--mono);font-size:11px;opacity:.55}
  .tagsug li.on{background:var(--hot);color:#111214}.tagsug li.new{border-top:1px solid var(--line,rgba(127,127,127,.3));font-size:14px}
.addtag .in{flex:1;min-width:0;padding:8px 10px;font-size:15px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
  .chips span{font-size:13px;padding:4px 9px;border:1.5px solid var(--ink);font-weight:600}
  .chips.guess span{border-style:dashed;border-color:var(--ink3);color:var(--ink2)}
  .more{padding:14px 0;font-size:13px;color:var(--ink3);font-family:var(--mono)}

  .empty{padding:44px 0 20px}
  .empty h2{font-weight:800;font-stretch:70%;font-size:34px;line-height:1;margin:0 0 10px;letter-spacing:-.01em}
  .empty p{color:var(--ink2);margin:0 0 18px;max-width:46ch;line-height:1.45}

  .shelf .bk{display:grid;grid-template-columns:8px 1fr auto;gap:0 14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--rule);cursor:pointer}
  .shelf .spine{width:8px;height:44px;background:var(--ink)}
  .shelf .bt{font-weight:700;font-stretch:85%;font-size:19px;line-height:1.15}
  .shelf .ba{font-size:13px;color:var(--ink2)}
  .shelf .bc{font-family:var(--mono);font-size:13px;color:var(--ink2)}

  .shelfbar{display:flex;justify-content:space-between;align-items:center;margin:16px 0 12px;font-family:var(--mono);font-size:12px;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase}
  .shelfbar select{border:0;background:none;font:inherit;color:var(--ink);text-transform:uppercase;letter-spacing:.06em;padding:4px 0;cursor:pointer}
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 14px;align-items:end;list-style:none;margin:0;padding:0 0 20px}
  @media (min-width:620px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
  .grid li{cursor:pointer;position:relative}
  .grid li:active{transform:scale(.98)}
  .cover{display:block;width:100%;box-shadow:0 1px 2px rgba(0,0,0,.12),0 6px 18px rgba(0,0,0,.10)}
  img.cover{height:auto}
  .ph{aspect-ratio:2/3;padding:10% 9%;display:flex;flex-direction:column;justify-content:space-between;color:#fff;overflow:hidden}
  .ph b{font-weight:800;font-stretch:66%;text-transform:uppercase;line-height:.95;font-size:clamp(13px,3.9vw,20px);letter-spacing:-.005em;overflow-wrap:break-word;hyphens:auto;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
  .ph i{padding-right:24px;font-style:normal;font-size:11px;font-weight:600;letter-spacing:.04em;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ph.light{color:#111214}
  .grid .ct{position:absolute;right:6px;bottom:6px;background:rgba(17,18,20,.82);color:#fff;font-family:var(--mono);font-size:11px;padding:2px 6px}
  .bookhead{padding:18px 0 6px}
  .hero{background:var(--wash);margin:0 calc(-1 * var(--pad));padding:8px var(--pad) 26px;position:relative}
  .hero .back{display:block;margin-bottom:6px}
  .hero .cv{width:46%;max-width:230px;margin:0 auto;position:relative}
  .hero .cv.edit{cursor:pointer}
  .hero .cv .addcv{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:var(--ink);color:var(--on-ink);font-size:12px;font-weight:700;padding:5px 10px;white-space:nowrap}
  .meta{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
  .meta span{border:2px solid var(--ink);padding:5px 10px;font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
  .cvrow{display:flex;gap:14px;align-items:center;margin:0 0 16px}
  .cvrow .thumb{width:72px;flex:none}
  .cvrow .btns{display:flex;flex-wrap:wrap;gap:8px}
  .cvrow input,.isbnrow input[type=file]{display:none}
  .isbnrow{display:flex;gap:8px}.isbnrow .in{flex:1;min-width:0}.isbnrow .btn{white-space:nowrap;display:flex;align-items:center}
  .cvbox{position:fixed;inset:0;background:rgba(17,18,20,.72);z-index:30;display:none;align-items:center;justify-content:center;padding:20px}
  .cvbox.on{display:flex}
  .cvpanel{background:var(--sheet);padding:20px;width:100%;max-width:420px;max-height:92vh;overflow:auto}
  .cvimg{display:block;max-width:100%;max-height:52vh;margin:0 auto;box-shadow:0 6px 18px rgba(0,0,0,.18)}
  .cvimg.dim{opacity:.45}
  .cvrow .ph{padding:8px 7px}.cvrow .ph b{font-size:10px}.cvrow .ph i{font-size:7px}
  .back{border:0;background:none;padding:6px 0;font-size:14px;color:var(--ink2)}
  .bookhead h2{font-weight:800;font-stretch:72%;font-size:clamp(34px,9vw,48px);line-height:.98;margin:18px 0 6px;letter-spacing:-.01em}
  .bookhead .ba{color:var(--ink2);font-size:14px}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}

  .btn{border:2px solid var(--ink);background:var(--paper);padding:9px 14px;font-weight:700;font-size:14px;letter-spacing:.02em;border-radius:0}
  .btn.solid{background:var(--ink);color:var(--on-ink)}
  .btn.hot{background:var(--hot);border-color:var(--hot);color:var(--on-hot)}
  .btn.ghost{border-color:var(--rule)}
  .btn.danger{border-color:var(--hot);color:var(--hot)}
  .btn:disabled{opacity:.4;cursor:default}

  .fab{position:fixed;right:calc(var(--pad) + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;border:0;background:#5a4df5;color:#ffffff;font-size:34px;line-height:1;box-shadow:0 6px 20px rgba(90,77,245,.38);display:none}
  .fab.on{display:block}

  /* sheets */
  .scrim{position:fixed;inset:0;background:rgba(17,18,20,.42);display:none;z-index:10}
  .scrim.on{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--sheet);z-index:11;transform:translateY(105%);transition:transform .22s ease;padding:22px var(--pad) calc(24px + env(safe-area-inset-bottom))}
  .sheet.on{transform:none}
  @media (min-width:700px){.sheet{left:50%;right:auto;width:640px;margin-left:-320px}}
  .sheet h3{margin:0 0 16px;font-weight:800;font-stretch:72%;font-size:28px;line-height:1.05;display:flex;justify-content:space-between;align-items:start;gap:10px}
  .sheet h3 .x{border:0;background:var(--wash);width:34px;height:34px;border-radius:50%;font-size:20px;flex:none}
  .f{display:block;margin:0 0 14px}
  .f > span{display:block;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
  .in{width:100%;border:2px solid var(--rule);padding:11px 12px;border-radius:0;background:var(--paper);font-size:17px;outline:none}
  .in:focus{border-color:var(--ink)}
  .two{display:grid;grid-template-columns:1fr 110px;gap:10px}
  .menu button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule);background:none;padding:16px 0}
  .menu button b{display:block;font-size:19px;font-weight:700;font-stretch:90%}
  .menu button span{font-size:14px;color:var(--ink2)}
  .seg{display:flex;border:2px solid var(--ink);margin-bottom:16px}
  .seg button{flex:1;border:0;background:var(--paper);padding:9px;font-weight:700;font-size:14px}
  .seg button[aria-pressed=true]{background:var(--ink);color:var(--on-ink)}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .thumbs img{width:64px;height:84px;object-fit:cover;border:1px solid var(--rule);display:block}
  .thumbs .th{position:relative}
  .thumbs .thx{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:2px solid var(--paper);background:var(--ink);color:var(--on-ink);font-size:15px;line-height:1;padding:0;cursor:pointer}
  .thumbs .th.bad img{outline:3px solid #d93b2b;outline-offset:-3px;opacity:.7}
  .thumbs .th span{position:absolute;left:0;right:0;bottom:0;background:#d93b2b;color:#fff;font-family:var(--mono);font-size:10px;text-align:center;padding:2px 0}
  .sheet .closeask{position:sticky;top:-22px;z-index:3;margin:-22px calc(-1 * var(--pad)) 16px;padding:18px var(--pad);background:var(--sheet);border-bottom:3px solid var(--ink);box-shadow:0 8px 20px rgba(0,0,0,.12)}
  .sheet .closeask p{margin:0;font-size:15px;color:var(--ink2)}.sheet .closeask b{color:var(--ink);font-size:17px}
  .sheet .closeask .actions{margin:12px 0 0}
  .drop{display:block;border:2px dashed var(--rule);padding:22px;text-align:center;color:var(--ink2);font-size:15px;cursor:pointer}
  .drop input{display:none}
  .status{font-family:var(--mono);font-size:13px;color:var(--ink2);margin:10px 0;min-height:1.2em}
  .err{color:var(--hot)}
  .review{list-style:none;padding:0;margin:8px 0 14px}
  .review li{display:grid;grid-template-columns:28px 1fr 74px 30px;gap:2px 6px;align-items:center;padding:6px 0 8px;border-bottom:1px solid var(--rule)}
  .review .kw{grid-column:2 / span 3;font-size:13px !important;color:var(--ink2);padding:3px 6px !important}
  .review .kw.guess{border:1px dashed var(--ink3) !important}
  .review .tag{grid-column:2 / span 3;font-size:12px;color:var(--ink3);padding:0 6px}
  .review li.dupe{opacity:.7}
  .review input[type=text]{border:1px solid transparent;padding:6px;font-size:15px;width:100%;background:transparent;text-overflow:ellipsis;white-space:nowrap;overflow:hidden}
  .review input[type=text]:focus{border-color:var(--ink);outline:none;background:var(--paper)}
  .review .pg{font-family:var(--mono);text-align:right}
  .review .rm{border:0;background:none;color:var(--ink3);font-size:18px}
  .review input[type=checkbox]{width:18px;height:18px;accent-color:var(--hot)}
  .sticky{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom));background:var(--sheet);padding:12px 0 4px;border-top:1px solid var(--rule);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .confirm{margin-top:12px;padding:12px;border:2px solid var(--hot);display:none}
  .confirm.on{display:block}
  .confirm p{margin:0 0 10px;font-size:14px}
  .toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--on-ink);padding:10px 16px;font-size:14px;opacity:0;transition:.2s;z-index:20;pointer-events:none;white-space:nowrap}
  .toast.on{opacity:1;transform:translateX(-50%)}
  .hidden{display:none !important}
  /* ---- type: Faculty Glyphic for titles, Anton for lesser headings, Archivo for everything else ---- */
  :root{--display:"Faculty Glyphic", Georgia, serif; --head:"Anton", "Archivo", sans-serif}
  .brand,.brand b{font-family:"Unbounded", var(--head);font-weight:600;font-stretch:normal;font-size:21px;letter-spacing:-.02em;text-transform:none}
  .searchbox input{font-family:var(--display);font-weight:400;font-stretch:normal;font-size:clamp(24px,6.6vw,48px);letter-spacing:-.015em}
  .rp h1{font-family:var(--display);font-weight:400;font-stretch:normal;font-size:clamp(32px,8.8vw,54px);line-height:1.02;letter-spacing:-.015em}
  .bookhead h2{font-family:var(--display);font-weight:400;font-stretch:normal;font-size:clamp(30px,8vw,46px);line-height:1.04;letter-spacing:-.015em}
  .empty h2,.sheet h3{font-family:var(--display);font-weight:400;font-stretch:normal;letter-spacing:-.01em}
  nav.tabs button{font-family:var(--head);font-weight:400;font-stretch:normal;font-size:17px;letter-spacing:.05em}
  .rp h3{font-family:var(--head);font-weight:400;font-size:16px;letter-spacing:.06em}
  .rate-row > span,.f > span{font-family:var(--head);font-weight:400;font-size:14px;letter-spacing:.06em}
  .meta span,.tg{font-family:var(--head);font-weight:400;font-size:14px;letter-spacing:.05em}

<body>
<div class="wrap">
  <header>
    <div class="mast">
      <a class="brand" href="#" id="homeBtn" aria-label="Cookbook Club home">Cookbook <b>Club</b></a>
      <div style="display:flex;align-items:center"><div class="stats" id="stats">Loading…</div><button class="themebtn" id="settingsBtn" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
    </div>
    <div class="searchbox" id="sbox">
      <input id="q" type="search" placeholder="What are we making?" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <button class="clear" id="clearq" aria-label="Clear search">×</button>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-search" aria-selected="true">Search</button>
      <button role="tab" id="tab-shelf" aria-selected="false">Shelf</button>
      <button role="tab" id="tab-plan" aria-selected="false">Plan</button>
    </nav>
    <div id="banner" class="banner hidden"></div>
  </header>
  <main id="main"></main>
</div>

<button class="fab" id="fab" aria-label="Add">+</button>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/cc-port.js"></script>
<script>
(() => {
  // ---------- state ----------
  const S = { plan: new Map(), quick: null, recent: [], planWeek: null, names: new Map(), photos: new Map(), photoLoading: new Set(), myNotes: {}, uid: null, user: null, isOwner: false, covers: new Map(), shelfSort: "title", books: new Map(), loaded: false, view: "search", openBook: null, canWrite: true, db: null, sample: null, limits: null };
  const $ = s => document.querySelector(s);
  const main = $("#main"), q = $("#q");

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/&/g, " and ").replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
  const splitKw = s => [...new Set(String(s || "").split(/[,;]/).map(x => x.trim().toLowerCase()).filter(Boolean))].slice(0, 12);
  const recKey = t => [...new Set(norm(t).split(" ").filter(w => w && !["and","with","the","a","of","in"].includes(w)).map(stem))].sort().join(" ");
  const rid = () => Math.random().toString(36).slice(2, 10);
  const plural = (n, w, pl) => `${n.toLocaleString()} ${n === 1 ? w : (pl || w + "s")}`;

  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.classList.add("on");
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 2200);
  }
  function banner(msg) { const b = $("#banner"); if (!msg) { b.classList.add("hidden"); return; } b.textContent = msg; b.classList.remove("hidden"); }

  // ---------- data ----------
  function allRecipes() {
    const out = [];
    for (const [id, b] of S.books) for (const r of (b.recipes || [])) out.push({ ...r, bookId: id, book: b });
    return out;
  }
  function sortedBooks() { return [...S.books.entries()].sort((a, b) => (a[1].title || "").localeCompare(b[1].title || "")); }

  // one write at a time per book doc
  const queues = new Map();
  function writeBook(id, mutate) {
    const prev = queues.get(id) || Promise.resolve();
    const next = prev.catch(() => {}).then(async () => {
      const cur = S.books.get(id);
      const body = cur ? JSON.parse(JSON.stringify(cur)) : { title: "", author: "", recipes: [], createdAt: Date.now() };
      const res = mutate(body);
      if (res === null) { await S.db.doc("books/" + id).delete(); S.books.delete(id); render(); return; }
      body.updatedAt = Date.now();
      if (JSON.stringify(body).length > 240000) throw { code: "too_big", message: "That book has too many entries to store in one record." };
      S.books.set(id, body); render();
      try { await S.db.doc("books/" + id).set(body); }
      catch (e) { if (cur) S.books.set(id, cur); else S.books.delete(id); render(); throw e; }
    });
    queues.set(id, next);
    return next.catch(e => { handleWriteErr(e); throw e; });
  }
  function handleWriteErr(e) {
    if (e?.code === "invalid_argument") { S.canWrite = false; render(); banner("You can look things up, but this copy can't save changes. Ask the owner for Contributor access."); }
    else if (e?.code === "quota_exceeded") banner("Storage is full. Remove a book you don't need to make room.");
    else if (e?.code === "too_big") banner(e.message);
    else banner("Couldn't save just now. Check your connection and try again.");
  }
  function newBookId() { return S.db.collection("books").doc().id; }

  // ---------- search ----------
  // crude singular form so "tomatoes" finds "tomato" and "squashes" finds "squash"
  const stem = w => w.length > 4 && /(oes|ches|shes|xes|sses)$/.test(w) ? w.slice(0, -2) : (w.length > 3 && /[^s]s$/.test(w) ? w.slice(0, -1) : w);
  const matchesWord = (word, term) => word.startsWith(term) || stem(word) === stem(term) || word.startsWith(stem(term));
  function search(query, onlyBook) {
    const nq = norm(query); if (!nq) return [];
    const terms = nq.split(" ");
    const hits = [];
    for (const r of allRecipes()) {
      if (onlyBook && r.bookId !== onlyBook) continue;
      const nt = norm(r.t), titleWords = nt.split(" ");
      const bookHay = norm(r.book.title) + " " + norm(r.book.author);
      const kws = (r.k || []).map(norm).filter(Boolean);
      const kwWords = kws.map(k => k.split(" "));
      let score = 0, via = [], ok = true;
      for (const t of terms) {
        if (titleWords.some(w => matchesWord(w, t))) { score += 10; continue; }
        const ki = kwWords.findIndex(ws => ws.some(w => matchesWord(w, t)));
        if (ki > -1) { score += r.ki ? 3 : 7; via.push(r.k[ki]); continue; }
        const tg = [...(r.tags || []), ...(r.tagsG || [])].find(x => norm(x).split(" ").some(w => matchesWord(w, t)));
        if (tg) { score += (r.tags || []).includes(tg) ? 6 : 2; via.push("#" + tg); continue; }
        const ig = (r.ing || []).find(x => norm(x).split(" ").some(w => matchesWord(w, t)));
        if (ig) { score += 5; via.push(ig); continue; }
        if (nt.includes(t)) { score += 4; continue; }
        if (!onlyBook && bookHay.includes(t)) { score += 1; continue; }
        ok = false; break;
      }
      if (!ok) continue;
      if (nt === nq) score += 100;
      if (nt.startsWith(nq)) score += 40;
      hits.push({ r: via.length ? { ...r, via: [...new Set(via)] } : r, score });
    }
    hits.sort((a, b) => b.score - a.score || a.r.t.localeCompare(b.r.t));
    return hits.map(h => h.r);
  }
  function highlight(text, query) {
    const terms = norm(query).split(" ").filter(Boolean);
    if (!terms.length) return esc(text);
    // mark word starts that begin with a term (case/diacritic-insensitive)
    return String(text).split(/(\s+)/).map(w => {
      const nw = norm(w);
      const t = terms.find(t => nw.startsWith(t));
      if (!t) return esc(w);
      // approximate: mark the first t.length letters
      let count = 0, i = 0;
      for (; i < w.length && count < t.length; i++) if (norm(w[i])) count++;
      return `<mark>${esc(w.slice(0, i))}</mark>${esc(w.slice(i))}`;
    }).join("");
  }

  // ---------- render ----------
  function renderStats() {
    if (!S.loaded) return;
    const n = allRecipes().length;
    $("#stats").textContent = `${plural(n, "recipe")} · ${plural(S.books.size, "book")}`;
  }
  function rowHTML(r, query, inBook) {
    return `<li class="row" data-book="${esc(r.bookId)}" data-rid="${esc(r.id)}">
      <div class="t">${query ? highlight(r.t, query) : esc(r.t)}</div>

  const COURSES = ["breakfast", "brunch", "appetizer", "snack", "soup", "salad", "main", "side", "dessert", "baking", "bread", "drink", "sauce"];
  const TAGS = ["breakfast", "brunch", "appetizer", "snack", "soup", "salad", "main", "side", "dessert", "baking", "bread", "drink", "sauce",
    "vegetarian", "vegan", "pescatarian", "gluten-free", "dairy-free", "weeknight", "make-ahead", "entertaining", "one-pot", "grilling"];
  // Ranks tags against what's typed: exact, then starts-with, then a word inside starts-with, then contains.
  // Ties go to tags used on more recipes, then shorter ones.
  function tagMatches(q, have) {
    const n = new Map(); for (const t of TAGS) n.set(t, 0);
    for (const x of allRecipes()) (x.tags || []).forEach(t => n.set(t, (n.get(t) || 0) + 1));
    const out = [];
    for (const [t, c] of n) {
      if (have.includes(t)) continue;
      const rank = t === q ? 0 : t.startsWith(q) ? 1 : t.split(/[\s-]+/).some(w => w.startsWith(q)) ? 2 : t.includes(q) ? 3 : -1;
      if (rank >= 0) out.push({ t, n: c, rank });
    }
    return out.sort((a, b) => a.rank - b.rank || b.n - a.n || a.t.length - b.t.length || a.t.localeCompare(b.t)).slice(0, 6);
  }
  function hlMatch(t, q) { const i = t.indexOf(q); return i < 0 ? esc(t) : esc(t.slice(0, i)) + "<b>" + esc(t.slice(i, i + q.length)) + "</b>" + esc(t.slice(i + q.length)); }
  function allTags() { const set = new Set(TAGS); for (const r of allRecipes()) (r.tags || []).forEach(t => set.add(t)); return [...set]; }
  const cap = t => String(t).replace(/(^|[\s-])\S/g, m => m.toUpperCase());

    try { const ps = await S.user.profiles(need); let got = false; for (const id of need) { const n = ps?.[id]?.name || ""; S.names.set(id, n); if (n) got = true; } if (got) render(); } catch {}
  }

      `<div class="note2 ${n.priv ? "priv" : ""}"><div class="who2">${esc(authorName(n.by))} · ${fmtDate(n.at)}${n.priv ? " · note to self" : ""}${w && (n.by === S.uid || S.isOwner) ? ` <button class="x" data-act="note-rm" data-v="${esc(n.id)}" data-priv="${n.priv ? 1 : 0}" aria-label="Delete note">×</button>` : ""}</div><p>${esc(n.text)}</p></div>`).join("");

          ${!conf.length && !guess.length ? `<span class="note" style="margin:0">None yet.</span>` : ""}
        </div>
        ${guess.length && w ? `<p class="note">Dashed tags are suggestions. Tap one to confirm it, or × to drop it.</p>` : ""}
        ${w ? `<form class="addtag" data-act-form="addtag"><div class="tagin"><input class="in" name="tag" placeholder="Add a tag" autocomplete="off" autocapitalize="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="tagsug" aria-autocomplete="list"><ul class="tagsug" id="tagsug" role="listbox" hidden></ul></div><button class="btn" type="submit">Add</button></form>` : ""}
      </section>

      };

        ul.innerHTML = items.map((it, i) => `<li role="option" id="ts${i}" aria-selected="${i === hi}" data-i="${i}" class="${i === hi ? "on" : ""}${it.isNew ? " new" : ""}"><span>${it.isNew ? `Add new tag “<b>${esc(it.t)}</b>”` : hlMatch(it.t, q)}</span>${!it.isNew && it.n ? `<small>${it.n} recipe${it.n === 1 ? "" : "s"}</small>` : ""}</li>`).join("");

      e.preventDefault(); const text = String(e.target.text.value || "").trim(); if (!text) return;
      addNote(S.openBook, r.id, text, !!e.target.self?.checked).then(() => toast("Note added"));

  // ---------- notes: shared ones live on the recipe, notes to self in your private space ----------
  async function addNote(bookId, rid, text, self) {
    const n = { id: rid8(), at: Date.now(), text: text.slice(0, 2000) };
    if (self && S.uid) {
      const next = JSON.parse(JSON.stringify(S.myNotes)); (next[rid] = next[rid] || []).push({ ...n, book: bookId });
      S.myNotes = next; render();
      try { await S.db.doc(`data/users/${S.uid}/notes`).set({ r: next }); } catch (e) { handleWriteErr(e); }
    } else await updRecipe(bookId, rid, x => { x.notes = [...(x.notes || []), { ...n, by: S.uid || "" }].slice(-200); });
  }
  async function removeNote(bookId, rid, nid, priv) {
    if (priv) {
      const next = JSON.parse(JSON.stringify(S.myNotes)); next[rid] = (next[rid] || []).filter(n => n.id !== nid); if (!next[rid].length) delete next[rid];
      S.myNotes = next; render();
      try { await S.db.doc(`data/users/${S.uid}/notes`).set({ r: next }); } catch (e) { handleWriteErr(e); }
    } else await updRecipe(bookId, rid, x => { x.notes = (x.notes || []).filter(n => n.id !== nid); });
  }
  const rid8 = () => Math.random().toString(36).slice(2, 10);

  // ---------- meal photos: one per recipe, stored on its own so the shelf stays light ----------
  async function mealPhoto(file) {
    const bmp = await loadBitmap(file);
    const sc = Math.min(1, 1000 / bmp.width);
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    const x = c.getContext("2d"); x.drawImage(bmp, 0, 0, c.width, c.height);
    // how bright is the lower part of the frame, where the title sits?
    const y0 = Math.floor(c.height * 0.55), px = x.getImageData(0, y0, c.width, c.height - y0).data;
    let sum = 0, n = 0; for (let i = 0; i < px.length; i += 16) { sum += 0.2126 * px[i] + 0.7152 * px[i + 1] + 0.0722 * px[i + 2]; n++; }
    const tone = sum / n / 255 > 0.58 ? "light" : "dark";
    let q = 0.78, url = c.toDataURL("image/jpeg", q);
    while (url.length > 190000 && q > 0.35) { q -= 0.08; url = c.toDataURL("image/jpeg", q); }
    return { src: url, tone };
  }
  async function saveMealPhoto(bookId, rid, ph) {
    S.photos.set(rid, ph.src);
    await S.db.doc("photos/" + rid).set({ src: ph.src, book: bookId, at: Date.now(), by: S.uid || "" });
    await updRecipe(bookId, rid, x => { x.ph = true; x.tone = ph.tone; });
  }

  // ---------- Mark as cooked: three full-screen steps ----------
  function openCookFlow(bookId, rid, at) {
    const r = getRecipe(bookId, rid); if (!r) return;
    updRecipe(bookId, rid, x => { x.cooked = [...(x.cooked || []), at || Date.now()].sort((a, b) => a - b).slice(-50); });
    const st = { step: 0, again: null, tags: new Set(r.tags || []), photo: null, rate: r.rate || 0, note: "", self: false, busy: false };
    const el = document.createElement("div"); el.className = "flow"; document.body.append(el);
    const close = () => { el.remove(); document.body.style.overflow = ""; };
    document.body.style.overflow = "hidden";
    const bar = () => `<div class="fbar">${st.step ? `<button class="fb" data-f="back" aria-label="Back">←</button>` : `<span class="fb"></span>`}
      <div class="prog">${[0, 1, 2].map(i => `<i class="${i <= st.step ? "on" : ""}"></i>`).join("")}</div><button class="fb" data-f="close" aria-label="Close">×</button></div>`;
    const draw = () => {
      let body = "", cta = "";
      if (st.step === 0) {
        body = `<h2>Would you make this again?</h2>
          <div class="yn"><button data-f="yes" class="${st.again === true ? "on" : ""}" aria-label="Yes">✓</button><button data-f="no" class="${st.again === false ? "on" : ""}" aria-label="No">×</button></div>
          <h4>How would you describe it?</h4>
          <div class="chips">${TAGS.map(t => `<button data-f="tag" data-v="${esc(t)}" class="${st.tags.has(t) ? "on" : ""}">${esc(cap(t))}</button>`).join("")}</div>`;
        cta = `<button class="btn solid big" data-f="next">Next</button>`;
      } else if (st.step === 1) {
        body = `<h2>Add a photo</h2><p class="fsub">Remember how it turned out. It shows at the top of the recipe.</p>
          <label class="pdrop">${st.photo ? `<img src="${st.photo.src}" alt="">` : `<span>📷<br>Add a photo</span>`}<input type="file" accept="image/*"></label>
          ${st.photo ? `<button class="lnk" data-f="nophoto">Remove photo</button>` : ""}`;
        cta = `<button class="btn solid big" data-f="next">${st.photo ? "Next" : "Skip"}</button>`;
      } else {
        body = `<h2>How did it turn out?</h2>
          <div class="stars big">${[1, 2, 3, 4, 5].map(n => `<button data-f="rate" data-v="${n}" class="${n <= st.rate ? "on" : ""}">${n <= st.rate ? "★" : "☆"}</button>`).join("")}</div>
          <h4>Add a note</h4><textarea class="in" rows="5" maxlength="2000" placeholder="Tips, swaps, what you'd change next time">${esc(st.note)}</textarea>
          ${S.uid ? `<label class="selfchk big"><input type="checkbox" ${st.self ? "checked" : ""}> Note to self (only you see it)</label>` : ""}
          <div class="status fst"></div>`;
        cta = `<button class="btn solid big" data-f="done" ${st.busy ? "disabled" : ""}>${st.busy ? "Saving…" : "Done"}</button>`;
      }
      el.innerHTML = `${bar()}<div class="fbody">${body}</div><div class="fcta">${cta}</div>`;
      const ta = el.querySelector("textarea"); if (ta) ta.oninput = () => { st.note = ta.value; };
      const cb = el.querySelector(".selfchk input"); if (cb) cb.onchange = () => { st.self = cb.checked; };
      const fi = el.querySelector(".pdrop input"); if (fi) fi.onchange = async () => {
        const f = fi.files[0]; if (!f) return; el.querySelector(".pdrop").classList.add("busy");
        try { st.photo = await mealPhoto(f); } catch { toast("Couldn't open that photo"); } draw(); };
    };
    el.onclick = async e => {
      const t = e.target.closest("[data-f]"); if (!t) return; const f = t.dataset.f;
      if (f === "close") { close(); toast("Marked as cooked"); return; }
      if (f === "back") { st.step--; draw(); return; }
      if (f === "yes") st.again = st.again === true ? null : true;
      if (f === "no") st.again = st.again === false ? null : false;
      if (f === "tag") { const v = t.dataset.v; st.tags.has(v) ? st.tags.delete(v) : st.tags.add(v); }
      if (f === "nophoto") st.photo = null;
      if (f === "rate") { const v = +t.dataset.v; st.rate = st.rate === v ? 0 : v; }
      if (f === "next") st.step++;
      if (f === "done") {
        st.busy = true; draw();
        try {
          if (st.photo) await saveMealPhoto(bookId, rid, st.photo);
          const tags = [...st.tags];
          await updRecipe(bookId, rid, x => {
            if (st.again !== null) x.again = st.again;
            if (st.rate) x.rate = st.rate;
            const prev = new Set(x.tags || []);
            x.tags = tags; x.tagsG = (x.tagsG || []).filter(g => !st.tags.has(g));
            x.tagsX = [...new Set([...(x.tagsX || []), ...[...prev].filter(p => !st.tags.has(p))])];
          });
          if (st.note.trim()) await addNote(bookId, rid, st.note.trim(), st.self);
          close(); toast("Saved"); render();
        } catch { st.busy = false; draw(); const m = el.querySelector(".fst"); if (m) { m.textContent = "Couldn't save just now. Try Done again."; m.classList.add("err"); } }
        return;
      }
      draw();
    };
    draw();
  }

  // ---------- meal plan (household) ----------
  // One doc per week at plan/<monday>, holding { entries: [...] }. Quick-entry types live at meta/plan.
  // Entry: { id, day:"YYYY-MM-DD", kind:"recipe"|"quick"|"note", b, r, qt, sb, sr, note, made:true|false|undefined, at }
  const QUICK_DEFAULT = [
    { id: "takeout", label: "Take Out", color: "#ffc94a" },
    { id: "diningout", label: "Dining Out", color: "#5a4df5" },
    { id: "pizza", label: "Pizza Night", color: "#ff876d" },
    { id: "nextovers", label: "Next-overs", color: "#3dbe8b", nx: true }
  ];
  const pad2 = n => String(n).padStart(2, "0");
  const dkey = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  const dparse = k => { const [y, m, d] = String(k).split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (k, n) => { const d = dparse(k); d.setDate(d.getDate() + n); return dkey(d); };
  const weekOf = k => { const d = dparse(k); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return dkey(d); };
  const todayKey = () => dkey(new Date());
  const dayLong = k => k === todayKey() ? "Today" : k === addDays(todayKey(), 1) ? "Tomorrow" : k === addDays(todayKey(), -1) ? "Yesterday" : dparse(k).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  const dayFull = k => dparse(k).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  function weekLabel(wk) {
    const a = dparse(wk), b = dparse(addDays(wk, 6));
    const m = d => d.toLocaleDateString(undefined, { month: "short" });
    return m(a) === m(b) ? `${m(a)} ${a.getDate()} to ${b.getDate()}` : `${m(a)} ${a.getDate()} to ${m(b)} ${b.getDate()}`;
  }
  const quickTypes = () => (S.quick && S.quick.length ? S.quick : QUICK_DEFAULT);
  const quickById = id => quickTypes().find(q => q.id === id);
  const inkOn = hex => { const h = String(hex || "#888").replace("#", ""); const [r, g, b] = [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) / 255); return (0.2126 * r + 0.7152 * g + 0.0722 * b) > 0.55 ? "#111214" : "#ffffff"; };
  const planAll = () => [...S.plan.values()].flat();
  const planFind = id => planAll().find(e => e.id === id);
  const recipeRef = (b, r) => { const bk = S.books.get(b); const rc = bk && (bk.recipes || []).find(x => x.id === r); return rc ? { ...rc, bookId: b, book: bk } : null; };

  const planQ = new Map();
  function writeWeek(wk, mutate) {
    const prev = planQ.get(wk) || Promise.resolve();
    const next = prev.catch(() => {}).then(async () => {
      const cur = S.plan.get(wk) || [];
      const body = JSON.parse(JSON.stringify(cur));
      mutate(body);
      body.sort((x, y) => x.day.localeCompare(y.day) || (x.at || 0) - (y.at || 0));
      S.plan.set(wk, body); render();
      try { await S.db.doc("plan/" + wk).set({ entries: body, updatedAt: Date.now() }); }
      catch (e) { S.plan.set(wk, cur); render(); throw e; }
    });
    planQ.set(wk, next);
    return next.catch(e => { handleWriteErr(e); throw e; });
  }
  function planAdd(entry) {
    const e = { id: rid8(), at: Date.now(), ...entry };
    return writeWeek(weekOf(e.day), list => { list.push(e); }).then(() => toast(`Added to ${dayLong(e.day)}`)).catch(() => {});
  }
  function planRemove(id) { const e = planFind(id); if (!e) return; writeWeek(weekOf(e.day), list => { const i = list.findIndex(x => x.id === id); if (i >= 0) list.splice(i, 1); }).catch(() => {}); }
  function planUpdate(id, fn) { const e = planFind(id); if (!e) return Promise.resolve(); return writeWeek(weekOf(e.day), list => { const x = list.find(y => y.id === id); if (x) fn(x); }).catch(() => {}); }
  async function planMove(id, day) {
    const e = planFind(id); if (!e || e.day === day) return;
    const moved = { ...e, day, made: undefined }; delete moved.made;
    if (weekOf(e.day) === weekOf(day)) { await planUpdate(id, x => { x.day = day; delete x.made; }); }
    else {
      try { await writeWeek(weekOf(day), list => { list.push(moved); }); await writeWeek(weekOf(e.day), list => { const i = list.findIndex(x => x.id === id); if (i >= 0) list.splice(i, 1); }); } catch { return; }
    }
    toast(`Moved to ${dayLong(day)}`);
  }
  async function saveQuick(list) {
    const prev = S.quick; S.quick = list; render();
    try { await S.db.doc("meta/plan").set({ quick: list, updatedAt: Date.now() }); } catch (e) { S.quick = prev; render(); handleWriteErr(e); }
  }

  // planned recipes from the last week that nobody has answered yet
  function pendingAsks() {
    const t = todayKey(), from = addDays(t, -7);
    return planAll().filter(e => e.kind === "recipe" && e.made === undefined && e.day < t && e.day >= from && recipeRef(e.b, e.r))
      .sort((a, b) => b.day.localeCompare(a.day));
  }
  function asksHTML(limit = 3) {
    if (!S.canWrite) return "";
    const list = pendingAsks(); if (!list.length) return "";
    return `<section class="ask"><h3>Did you make it?</h3>${list.slice(0, limit).map(e => { const r = recipeRef(e.b, e.r);
      return `<div class="askrow"><div class="askt"><b>${esc(r.t)}</b><small>Planned for ${esc(dayLong(e.day))}</small></div>
        <div class="askb"><button data-act="made-yes" data-id="${esc(e.id)}">Yes</button><button data-act="made-no" data-id="${esc(e.id)}">No</button><button data-act="plan-move" data-id="${esc(e.id)}">Move</button></div></div>`; }).join("")}
      ${list.length > limit ? `<p class="note">${list.length - limit} more on the Plan tab.</p>` : ""}</section>`;
  }

  function entryHTML(e) {
    const menu = S.canWrite ? `<button class="emenu" data-act="plan-menu" data-id="${esc(e.id)}" aria-label="Options">•••</button>` : "";
    const made = e.made === true ? `<span class="emade">✓ Made</span>` : e.made === false ? `<span class="emade no">Skipped</span>` : "";
    if (e.kind === "recipe") {
      const r = recipeRef(e.b, e.r);
      if (!r) return `<li class="ent"><div class="eb"><span class="et gone">Recipe removed</span></div>${menu}</li>`;
      return `<li class="ent ${e.made === false ? "skip" : ""}"><button class="eb" data-act="plan-open" data-b="${esc(e.b)}" data-r="${esc(e.r)}"><span class="et">${esc(r.t)}</span><span class="es">${esc(r.book.title)} · p. ${esc(r.p || "?")}${made ? " · " + made : ""}</span></button>${menu}</li>`;
    }
    if (e.kind === "quick") {
      const q = quickById(e.qt) || { label: "Quick entry", color: "#9a9da3" };
      const src = e.sb ? recipeRef(e.sb, e.sr) : null;
      return `<li class="ent"><div class="eb"><span class="qchip" style="background:${esc(q.color)};color:${inkOn(q.color)}">${esc(q.label)}</span>
        ${src ? `<span class="es">from <button class="lnk" data-act="plan-open" data-b="${esc(e.sb)}" data-r="${esc(e.sr)}">${esc(src.t)}</button></span>` : ""}
        ${e.note ? `<span class="enote">${esc(e.note)}</span>` : ""}</div>${menu}</li>`;
    }
    return `<li class="ent"><div class="eb"><span class="enote solo">${esc(e.note)}</span></div>${menu}</li>`;
  }

  function jumpHTML() {
    const rec = recentRecipes(5); if (!rec.length) return "";
    return `<section class="jump"><h3>Jump back in</h3><ul class="list">${rec.map(r => rowHTML(r)).join("")}</ul></section>`;
  }
  function renderPlan() {
    const wk = S.planWeek || weekOf(todayKey()), t = todayKey(), thisWk = weekOf(t) === wk;
    const byDay = new Map(); for (const e of (S.plan.get(wk) || [])) { if (!byDay.has(e.day)) byDay.set(e.day, []); byDay.get(e.day).push(e); }
    const days = [0, 1, 2, 3, 4, 5, 6].map(i => addDays(wk, i));
    main.innerHTML = `<div class="plan">${asksHTML(5)}
      <div class="wkbar"><button class="wkarrow" data-act="wk" data-v="-1" aria-label="Previous week">‹</button>
        <div class="wkt"><b>${esc(weekLabel(wk))}</b>${thisWk ? `<small>This week</small>` : `<button class="lnk" data-act="wk" data-v="0">Back to this week</button>`}</div>
        <button class="wkarrow" data-act="wk" data-v="1" aria-label="Next week">›</button></div>
      <ol class="days">${days.map(k => { const d = dparse(k), list = byDay.get(k) || [];
        return `<li class="day ${k === t ? "today" : ""} ${k < t ? "past" : ""}">
          <div class="dh"><span class="dn">${esc(d.toLocaleDateString(undefined, { weekday: "short" }))}</span><span class="dd">${d.getDate()}</span>${k === t ? `<span class="tdy">Today</span>` : ""}
            ${S.canWrite ? `<button class="dadd" data-act="plan-add" data-day="${k}" aria-label="Add to ${esc(dayFull(k))}">+</button>` : ""}</div>
          ${list.length ? `<ul class="ents">${list.map(entryHTML).join("")}</ul>` : ""}</li>`; }).join("")}</ol>
      ${!planAll().length ? `<p class="note">Tap + on a day to plan a recipe, a quick night like Take Out, or a note. Recipe pages have an "Add to meal plan" button too.</p>` : ""}</div>`;
  }

  // a list of the next two weeks of days, plus any date
  function openDaySheet(title, current, onPick) {
    const t = todayKey();
    const days = Array.from({ length: 14 }, (_, i) => addDays(t, i));
    openSheet(`${head(title)}<div class="menu daylist">${days.map(k => `<button data-day="${k}" class="${k === current ? "cur" : ""}"><b>${esc(dayLong(k))}</b>${k === t || k === addDays(t, 1) ? `<span>${esc(dayFull(k))}</span>` : ""}${k === current ? `<span> · currently</span>` : ""}</button>`).join("")}</div>
      <label class="f" style="margin-top:16px"><span>Another day</span><input class="in" type="date" name="other"></label>`, root => {
      root.querySelectorAll("[data-day]").forEach(b => b.onclick = () => { closeSheet(); onPick(b.dataset.day); });
      const o = root.querySelector("[name=other]"); o.onchange = () => { if (/^\d{4}-\d\d-\d\d$/.test(o.value)) { closeSheet(); onPick(o.value); } };
    });
  }

  function pickRowHTML(r) { return `<button class="prow" data-b="${esc(r.bookId)}" data-r="${esc(r.id)}"><span class="t">${esc(r.t)}</span><span class="b">${esc(r.book.title)} · p. ${esc(r.p || "?")}</span></button>`; }
  function recentRecipes(n) { const out = [], seen = new Set(); for (const v of S.recent) { const k = v.b + "/" + v.r; if (seen.has(k)) continue; const r = recipeRef(v.b, v.r); if (r) { seen.add(k); out.push(r); } if (out.length >= n) break; } return out; }

  function openPlanPicker(day) {
    const st = { day, nx: false };
    const nxSources = () => {
      const seen = new Set(), out = [];
      const from = addDays(st.day, -14);
      for (const e of planAll().filter(e => e.kind === "recipe" && e.day < st.day && e.day >= from).sort((a, b) => b.day.localeCompare(a.day))) {
        const k = e.b + "/" + e.r; if (seen.has(k)) continue; const r = recipeRef(e.b, e.r); if (r) { seen.add(k); out.push([k, `${r.t} (${dayLong(e.day)})`]); }
      }
      for (const r of recentRecipes(8)) { const k = r.bookId + "/" + r.id; if (!seen.has(k)) { seen.add(k); out.push([k, r.t]); } }
      return out;
    };
    const lists = query => {
      if (query.trim()) {
        const hits = search(query.trim()).slice(0, 30);
        return hits.length ? `<div class="plist">${hits.map(pickRowHTML).join("")}</div>` : `<p class="note">Nothing on the shelf matches “${esc(query)}”.</p>`;
      }
      const rec = recentRecipes(6), favs = allRecipes().filter(r => r.fav).sort((a, b) => a.t.localeCompare(b.t)).slice(0, 12);
      return (rec.length ? `<h4>Recently viewed</h4><div class="plist">${rec.map(pickRowHTML).join("")}</div>` : "") +
        (favs.length ? `<h4>Bookmarks</h4><div class="plist">${favs.map(pickRowHTML).join("")}</div>` : "") +
        (!rec.length && !favs.length ? `<p class="note">Search for a recipe, or bookmark a few to see them here.</p>` : "");
    };
    openSheet(`${head("Add to the plan")}
      <label class="f dsel"><span>Day</span><input class="in" type="date" name="day" value="${esc(day)}"></label>
      <input class="in" type="search" name="pq" placeholder="Search recipes" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="pres">${lists("")}</div>
      <h4>Quick entries</h4>
      <div class="qrow">${quickTypes().map(q => `<button class="qchip big" data-qt="${esc(q.id)}" style="background:${esc(q.color)};color:${inkOn(q.color)}">${esc(q.label)}</button>`).join("")}</div>
      <form class="nxf hidden"><p class="note" style="margin-top:0">Leftovers turned into something new. Both fields are optional.</p>
        <label class="f"><span>Riffing on</span><select class="in" name="src"><option value="">Nothing in particular</option>${nxSources().map(([k, l]) => `<option value="${esc(k)}">${esc(l)}</option>`).join("")}</select></label>
        <label class="f"><span>Note</span><input class="in" name="note" maxlength="200" placeholder="Fried rice with Sunday's pork"></label>
        <button class="btn hot" type="submit">Add Next-overs</button></form>
      <h4>Or a note</h4>
      <form class="pnote"><div class="isbnrow"><input class="in" name="note" maxlength="200" placeholder="Kelsey out, eat early, etc."><button class="btn" type="submit">Add</button></div></form>`, root => {
      const dayIn = root.querySelector("[name=day]"); dayIn.onchange = () => { if (/^\d{4}-\d\d-\d\d$/.test(dayIn.value)) st.day = dayIn.value; };
      const pq = root.querySelector("[name=pq]"), pres = root.querySelector(".pres");
      pq.oninput = () => { pres.innerHTML = lists(pq.value); };
      pres.onclick = e => { const b = e.target.closest(".prow"); if (!b) return; closeSheet(); planAdd({ day: st.day, kind: "recipe", b: b.dataset.b, r: b.dataset.r }); };
      const nxf = root.querySelector(".nxf");
      root.querySelectorAll("[data-qt]").forEach(b => b.onclick = () => {
        const q = quickById(b.dataset.qt);
        if (q?.nx) { nxf.classList.toggle("hidden"); b.classList.toggle("on", !nxf.classList.contains("hidden")); if (!nxf.classList.contains("hidden")) nxf.scrollIntoView({ block: "nearest" }); return; }
        closeSheet(); planAdd({ day: st.day, kind: "quick", qt: b.dataset.qt });
      });
      nxf.onsubmit = e => { e.preventDefault(); const src = nxf.src.value.split("/"); const note = nxf.note.value.trim();
        const q = quickTypes().find(x => x.nx); closeSheet();
        planAdd({ day: st.day, kind: "quick", qt: q ? q.id : "nextovers", ...(src[0] ? { sb: src[0], sr: src[1] } : {}), ...(note ? { note } : {}) }); };
      const pn = root.querySelector(".pnote"); pn.onsubmit = e => { e.preventDefault(); const note = pn.note.value.trim(); if (!note) return; closeSheet(); planAdd({ day: st.day, kind: "note", note }); };
    });
  }

  function openEntryMenu(id) {
    const e = planFind(id); if (!e) return;
    const r = e.kind === "recipe" ? recipeRef(e.b, e.r) : null, src = e.sb ? recipeRef(e.sb, e.sr) : null;
    const title = r ? r.t : e.kind === "quick" ? (quickById(e.qt)?.label || "Quick entry") : "Note";
    openSheet(`${head(esc(title))}<p class="note" style="margin:-8px 0 8px">${esc(dayFull(e.day))}</p><div class="menu">
      ${r ? `<button data-go="open"><b>Open recipe</b><span>${esc(r.book.title)} · p. ${esc(r.p || "?")}</span></button>` : ""}
      ${src ? `<button data-go="src"><b>Open ${esc(src.t)}</b><span>The dish this riffs on</span></button>` : ""}

  // ---- straightening: Claude finds the cover's corners, the canvas flattens it ----
  // Self-contained: prepareCover() is the only caller. Drop it when covers come from a lookup instead.
  async function loadBitmap(file) {
    try { return await createImageBitmap(file, { imageOrientation: "from-image" }); }
    catch { return await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); }); }

    while (url.length > 150000 && q > 0.4) { q -= 0.1; url = c.toDataURL("image/jpeg", q); }
    return url;
  }
  function plainCover(bmp, maxW = 480) {
    const sc = Math.min(1, maxW / bmp.width);
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return toJpeg(c);
  }
  function solve(A, bv) { // Gaussian elimination, 8x8
    const n = bv.length, M = A.map((r, i) => [...r, bv[i]]);
    for (let i = 0; i < n; i++) {
      let p = i; for (let r = i + 1; r < n; r++) if (Math.abs(M[r][i]) > Math.abs(M[p][i])) p = r;
      [M[i], M[p]] = [M[p], M[i]];
      if (Math.abs(M[i][i]) < 1e-12) return null;
      for (let r = 0; r < n; r++) if (r !== i) { const f = M[r][i] / M[i][i]; for (let c = i; c <= n; c++) M[r][c] -= f * M[i][c]; }
    }
    return M.map((r, i) => r[n] / r[i]);
  }
  function quadOk(q) {
    if (!Array.isArray(q) || q.length !== 4) return false;
    if (!q.every(p => Array.isArray(p) && p.length === 2 && p.every(v => typeof v === "number" && v > -0.03 && v < 1.03))) return false;
    let sign = 0, area = 0;
    for (let i = 0; i < 4; i++) {
      const [a, b, c] = [q[i], q[(i + 1) % 4], q[(i + 2) % 4]];
      const cr = (b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]);
      if (cr === 0 || (sign && Math.sign(cr) !== sign)) return false; sign = Math.sign(cr);
      area += a[0] * b[1] - b[0] * a[1];
    }
    return Math.abs(area) / 2 > 0.06;
  }
  function warp(bmp, quad, maxW = 480) {
    // work from a copy no larger than 1800px so phone photos stay fast
    const sc = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
    const sw = Math.round(bmp.width * sc), sh = Math.round(bmp.height * sc);
    const sc1 = document.createElement("canvas"); sc1.width = sw; sc1.height = sh;
    const sx = sc1.getContext("2d"); sx.drawImage(bmp, 0, 0, sw, sh);
    const src = sx.getImageData(0, 0, sw, sh).data;
    const P = quad.map(([x, y]) => [x * sw, y * sh]);
    const d = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
    const W0 = (d(P[0], P[1]) + d(P[3], P[2])) / 2, H0 = (d(P[0], P[3]) + d(P[1], P[2])) / 2;
    const ratio = H0 / W0; if (!(ratio > 0.5 && ratio < 2.4)) return null;
    const W = Math.round(Math.min(maxW, W0)), H = Math.round(W * ratio);
    const dst = [[0, 0], [W, 0], [W, H], [0, H]], A = [], bv = [];
    for (let i = 0; i < 4; i++) {
      const [u, v] = dst[i], [x, y] = P[i];
      A.push([u, v, 1, 0, 0, 0, -u * x, -v * x]); bv.push(x);
      A.push([0, 0, 0, u, v, 1, -u * y, -v * y]); bv.push(y);
    }
    const h = solve(A, bv); if (!h) return null;
    const out = document.createElement("canvas"); out.width = W; out.height = H;
    const ox = out.getContext("2d"), img = ox.createImageData(W, H), o = img.data;
    for (let v = 0; v < H; v++) for (let u = 0; u < W; u++) {
      const z = h[6] * u + h[7] * v + 1, x = (h[0] * u + h[1] * v + h[2]) / z, y = (h[3] * u + h[4] * v + h[5]) / z;
      const x0 = Math.max(0, Math.min(sw - 2, Math.floor(x))), y0 = Math.max(0, Math.min(sh - 2, Math.floor(y)));
      const fx = Math.max(0, Math.min(1, x - x0)), fy = Math.max(0, Math.min(1, y - y0));
      const i00 = (y0 * sw + x0) * 4, i10 = i00 + 4, i01 = i00 + sw * 4, i11 = i01 + 4, k = (v * W + u) * 4;
      for (let c = 0; c < 3; c++) o[k + c] = (src[i00 + c] * (1 - fx) + src[i10 + c] * fx) * (1 - fy) + (src[i01 + c] * (1 - fx) + src[i11 + c] * fx) * fy;
      o[k + 3] = 255;
    }
    ox.putImageData(img, 0, 0);
    return toJpeg(out);
  }
  const COVER_PROMPT = `This is a photo of a cookbook's front cover, possibly taken at an angle with a table or background around it.
Find the four outer corners of the FRONT COVER itself: not the spine, not the background, not a shadow, not a dust-jacket flap.
Give each corner as [x, y] in fractions of the image width and height (0 to 1, origin at the top-left of the image), in this order: top-left, top-right, bottom-right, bottom-left of the cover as it reads upright.
Also read the main title (title case, without the subtitle) and the author name(s) as printed, joined with " & " if several, or "" if none.
If any corner of the cover is cut off or hidden, set "found" to false and "corners" to [].
Reply with only JSON: {"found":true,"corners":[[0.1,0.1],[0.9,0.1],[0.9,0.9],[0.1,0.9]],"title":"...","author":"..."}`;

  // file -> {src, straightened, title, author} or null if cancelled
  async function prepareCover(file) {

    const plain = plainCover(bmp);

        <div class="actions"><button class="btn ghost" data-k="skip">Skip, use photo as is</button></div>`);

  // ---- ISBN, for exact cover lookups later ----
  function isbnOk(raw) {
    const s = String(raw || "").replace(/[^0-9X]/gi, "").toUpperCase();
    if (s.length === 13 && /^\d+$/.test(s)) return [...s].reduce((t, d, i) => t + +d * (i % 2 ? 3 : 1), 0) % 10 === 0 ? s : null;
    if (s.length === 10 && /^\d{9}[\dX]$/.test(s)) return [...s].reduce((t, d, i) => t + (d === "X" ? 10 : +d) * (10 - i), 0) % 11 === 0 ? s : null;

  // barcode decoding runs on the device: no Claude call, nothing uploaded

  let zxingP = null;
  function loadZxing() {
    if (window.ZXing) return Promise.resolve(window.ZXing);

      const el = document.createElement("script"); el.src = ZXING_URL;
      el.onload = () => window.ZXing ? res(window.ZXing) : rej(new Error("no zxing"));
      el.onerror = () => { zxingP = null; rej(new Error("load failed")); };

  async function decodeBarcode(file) {

    const hints = new Map([[Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.EAN_8]], [Z.DecodeHintType.TRY_HARDER, true]]);

      x.drawImage(bmp, 0, 0, w, h);

        const t = r.getText(); if (isbnOk(t) && /^97[89]/.test(t)) return t;

  function parsePasted(text) {
    const out = [];
    for (let line of String(text).split(/\r?\n/)) {
      line = line.replace(/\t/g, " ").trim(); if (!line) continue;
      const m = line.match(/^(.*?)[\s.·•_…\-]*?\s*((?:p\.?\s*)?\d{1,4}(?:\s*[-–]\s*\d{1,4})?)\s*$/i);
      if (!m) continue;
      const t = m[1].replace(/[\s.·•_…\-,:]+$/, "").trim(); const p = m[2].replace(/^p\.?\s*/i, "").replace(/\s+/g, "");
      if (t && /[a-z]/i.test(t)) out.push({ t, p });
    }
    return out;
  }

Rules:
