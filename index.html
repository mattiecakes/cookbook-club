      sheetGuard = () => busy ? { title: "Stop reading and close?", body: entries.length ? `${plural(entries.length, "recipe")} read so far will be lost.` : "The pages read so far will be lost.", stay: "Keep reading", leave: "Stop and close" }
        : entries.length ? { title: "Close without saving?", body: `${plural(entries.length, "recipe")} found but not added yet.`, stay: "Keep reviewing", leave: "Discard them" }
        : files.length ? { title: "Discard these photos?", body: `${plural(files.length, "photo")} waiting to be read.`, stay: "Keep them", leave: "Discard" } : null;
      const bookSel = root.querySelector("select[name=book]"), bookOnly = root.querySelector("#bookonly"), bookOnlyNote = root.querySelector("#bookonlynote");
      const syncBookOnly = () => { const n = bookSel.value === "__new"; bookOnly.classList.toggle("hidden", !n); bookOnlyNote.classList.toggle("hidden", !n); };
      bookSel.addEventListener("change", syncBookOnly); syncBookOnly();
      bookOnly.onclick = async () => {
        if (busy) return;
        bookOnly.disabled = true; st.classList.remove("err");
        try {
          const id = await resolveBook(root);
          toast(`${S.books.get(id)?.title || "Book"} is on the shelf`);
          files = []; entries = []; closeSheet(true); S.view = "book"; S.openBook = id; render(); window.scrollTo(0, 0);
        } catch (e) { if (e?.quiet) { st.textContent = "Give the book a title first."; st.classList.add("err"); } }
        finally { bookOnly.disabled = false; }
      };

      stop.onclick = () => busy?.abort();

      go.onclick = async () => {
        st.classList.remove("err");
        if (mode === "paste") {
          const got = parsePasted(root.querySelector("[name=paste]").value);
          if (!got.length) { st.textContent = "Couldn't find any lines ending in a page number."; st.classList.add("err"); return; }
          got.forEach(e => addEntry({ ...e, k: [], on: true }));
          return showReview();
        }
        if (!files.length) { st.textContent = entries.length ? "" : "Add at least one photo first."; st.classList.toggle("err", !entries.length); if (entries.length) showReview(); return; }
        // one page per call keeps long index pages from being cut off. A page that fails stays in the
        // queue marked "Not read"; pages that worked leave the queue, so a retry only redoes the failures.
        const queue = files.slice(); failed.clear();
        go.disabled = true; bookOnly.disabled = true; stop.classList.remove("hidden"); root.querySelector("[data-mode=paste]").disabled = true;
        busy = new AbortController(); drawThumbs();
        let found = 0, stopped = false, fatal = null;
        for (let i = 0; i < queue.length && !stopped && !fatal; i++) {
          const f = queue[i], ctl = new AbortController(); busy = ctl;
          st.classList.remove("err");
          st.textContent = queue.length > 1 ? `Reading page ${i + 1} of ${queue.length}… (up to a minute each)` : "Reading… (this can take up to a minute)";
          const slow = setTimeout(() => { ctl.slow = true; ctl.abort(); }, 180000); // a page that hangs counts as failed, the rest carry on
          try {
            const res = await S.sample.json(PROMPT, { images: [f], signal: ctl.signal });
            const list = Array.isArray(res) ? res : (res?.entries || []);
            let n = 0;
            for (const e of list) {
              const t = String(e?.title || "").trim(); if (!t) continue;
              const k = splitKw(Array.isArray(e?.ingredients) ? e.ingredients.join(",") : "");
              addEntry({ t, p: String(e?.page ?? "").trim(), k, ki: e?.source === "guess" && k.length > 0, on: true }); n++;
            }
            found += n;
            if (n) files = files.filter(x => x !== f); else failed.add(f);
          } catch (e) {
            if (e?.code === "cancelled" && !ctl.slow) stopped = true;
            else if (["not_granted", "sampling_disabled", "images_unavailable", "rate_limited", "quota_exceeded"].includes(e?.code)) { fatal = e; failed.add(f); }
            else failed.add(f);
          } finally { clearTimeout(slow); }
          drawThumbs();
        }
        busy = null; go.disabled = false; bookOnly.disabled = false; stop.classList.add("hidden"); root.querySelector("[data-mode=paste]").disabled = false;
        drawThumbs();
        const left = files.length, bad = [...failed].filter(f => files.includes(f)).length;
        if (fatal) {
          st.textContent = SAMPLE_COPY[fatal?.code] || "Claude couldn't read the photos right now."; st.classList.add("err");
          if (["not_granted", "sampling_disabled", "images_unavailable"].includes(fatal?.code)) { S.limits = null; setMode("paste"); root.querySelector("[data-mode=photos]").disabled = true; }
          if (entries.length) showReview(`${plural(entries.length, "recipe")} read before it stopped. The rest of the photos are still queued.`);
          return;
        }
        const tail = bad ? ` ${plural(bad, "page")} couldn't be read and ${bad === 1 ? "is" : "are"} still in the queue. Tap "Read more pages" to try ${bad === 1 ? "it" : "them"} again or remove ${bad === 1 ? "it" : "them"}.` : left ? ` ${plural(left, "page")} still in the queue.` : "";
        if (!entries.length) { st.textContent = stopped ? "Stopped." : `Couldn't find any recipes in ${bad === 1 ? "that photo" : "those photos"}. Try a closer, straighter shot.`; st.classList.toggle("err", !stopped); return; }
        showReview((stopped ? "Stopped. Kept what was read so far." : "") + tail);
      };

      // the same recipe shows up under several index headings, often on different photos: merge them
      function addEntry(n) {
        const key = recKey(n.t);
        const m = entries.find(e => recKey(e.t) === key && (!e.p || !n.p || e.p === n.p));
        if (!m) { entries.push(n); return; }
        if (!m.p) m.p = n.p;
        if (n.ki && !m.ki && m.k.length) return; // index-sourced beats a guess
        if (!n.ki && n.k.length && m.ki) { m.k = n.k.slice(); m.ki = false; return; }
        m.k = [...new Set(m.k.concat(n.k))].slice(0, 12);
      }
      function showReview(extra) {
        // match against what's already in the chosen book
        const sel = root.querySelector("select[name=book]");
        const existing = sel.value !== "__new" ? S.books.get(sel.value) : null;
        const have = new Map((existing?.recipes || []).map(r => [recKey(r.t), r]));
        entries.forEach(e => {
          const ex = have.get(recKey(e.t));
          e.match = ex ? ex.id : null;
          if (ex) { const fresh = e.k.filter(k => !(ex.k || []).includes(k)); e.newK = fresh; e.on = fresh.length > 0 && !e.ki; }
        });
        root.querySelector("#step1").classList.add("hidden"); root.querySelector("#step2").classList.remove("hidden");
        drawReview();
        const ex = root.querySelector("#st2"); ex.textContent = extra ? extra.trim() : ""; ex.classList.toggle("err", /couldn't/.test(extra || ""));
      }
      function drawReview() {
        const rev = root.querySelector("#rev");
        rev.innerHTML = entries.map((e, i) => `<li class="${e.match ? "dupe" : ""}" data-i="${i}">
          <input type="checkbox" ${e.on ? "checked" : ""} aria-label="Include">
          <input type="text" value="${esc(e.t)}" aria-label="Title" ${e.match ? "readonly" : ""}>
          <input type="text" class="pg" value="${esc(e.p)}" inputmode="numeric" aria-label="Page" ${e.match ? "readonly" : ""}>
          <button class="rm" aria-label="Remove">×</button>
          <input type="text" class="kw ${e.ki ? "guess" : ""}" value="${esc(e.k.join(", "))}" placeholder="ingredients" aria-label="Ingredients">
          ${e.match ? `<div class="tag">Already in this book.${e.newK?.length ? ` Checked adds: ${esc(e.newK.join(", "))}` : ""}</div>` : e.ki && e.k.length ? `<div class="tag">Ingredients guessed from the title</div>` : ""}</li>`).join("");
        rev.querySelectorAll("li").forEach(li => {
          const e = entries[+li.dataset.i]; const [cb, t, p, kw] = li.querySelectorAll("input");
          cb.onchange = () => { e.on = cb.checked; count(); };
          t.oninput = () => { e.t = t.value; }; p.oninput = () => { e.p = p.value; };
          kw.oninput = () => { e.k = splitKw(kw.value); e.ki = false; kw.classList.remove("guess"); if (e.match) e.newK = e.k; };
          li.querySelector(".rm").onclick = () => { entries.splice(+li.dataset.i, 1); drawReview(); };
        });
        count();
      }
      function count() {
        const n = entries.filter(e => e.on && e.t.trim() && !e.match).length;
        const u = entries.filter(e => e.on && e.match).length;
        const dupes = entries.filter(e => e.match).length;
        const guessed = entries.filter(e => e.ki && e.k.length).length;
        const btn = root.querySelector("#save");
        btn.textContent = n && u ? `Add ${plural(n, "recipe")}, update ${u}` : u ? `Update ${plural(u, "recipe")}` : `Add ${plural(n, "recipe")}`;
        btn.disabled = !n && !u;
        root.querySelector("#sum").textContent = `Found ${plural(entries.length, "recipe")}${dupes ? `, ${dupes} already in this book` : ""}${guessed ? `. Dashed ingredients are guesses` : ""}. Fix anything misread and uncheck what isn't a recipe.`;
      }
      root.querySelector("#more").onclick = () => {
        root.querySelector("#step2").classList.add("hidden"); root.querySelector("#step1").classList.remove("hidden");
        st.textContent = `${plural(entries.length, "entry", "entries")} waiting for review${files.length ? `, ${plural(files.length, "photo")} still queued` : ""}`; st.classList.remove("err");
      };
      root.querySelector("#save").onclick = async () => {
        const st2 = root.querySelector("#st2"), btn = root.querySelector("#save");
        const keep = entries.filter(e => e.on && e.t.trim() && !e.match).map(e => {
          const r = { id: rid(), t: e.t.trim(), p: e.p.trim(), k: e.k }; if (e.ki && e.k.length) r.ki = true; return r; });
        const updates = new Map(entries.filter(e => e.on && e.match).map(e => [e.match, e]));
        btn.disabled = true; st2.textContent = "Saving…";
        try {
          let id;
          try { id = await resolveBook(root); }
          catch (e) { if (e?.quiet) { root.querySelector("#more").click(); st.textContent = "Give the new book a title first."; st.classList.add("err"); } btn.disabled = false; st2.textContent = ""; return; }
          await writeBook(id, b => {
            b.recipes = (b.recipes || []).map(r => {
              const e = updates.get(r.id); if (!e) return r;
              const k = e.ki ? (r.k || []) : [...new Set((r.ki ? [] : (r.k || [])).concat(e.k))].slice(0, 12);
              const out = { ...r, k }; if (!e.ki) delete out.ki; if (!out.p && e.p) out.p = e.p; return out;
            }).concat(keep);
          });
          toast(keep.length ? `${plural(keep.length, "recipe")} added to ${S.books.get(id)?.title}` : `${plural(updates.size, "recipe")} updated`);
          if (keep.length && canSee()) suggestTags(id, keep.map(k => k.id)).then(n => n && toast(`Suggested tags for ${plural(n, "recipe")}`)).catch(() => {});
          entries = []; files = []; closeSheet(true); S.view = "book"; S.openBook = id; render(); window.scrollTo(0, 0);
        } catch { btn.disabled = false; st2.textContent = ""; }
      };
      return () => { busy?.abort(); urls.forEach(URL.revokeObjectURL); };
    });
  }

  // ---------- events ----------
  q.addEventListener("input", () => { if (S.view !== "search") S.view = "search"; render(); });
  $("#clearq").onclick = () => { q.value = ""; q.focus(); render(); };
  $("#homeBtn").onclick = e => { e.preventDefault(); q.value = ""; S.openBook = null; go("search"); };
  $("#tab-search").onclick = () => { S.view = "search"; render(); q.focus(); };
  $("#tab-shelf").onclick = () => { S.view = "shelf"; render(); };
  $("#tab-plan").onclick = () => { if (S.view !== "plan") S.planWeek = weekOf(todayKey()); S.view = "plan"; render(); window.scrollTo(0, 0); };
  // + opens a new-book import; inside a book it adds pages to that book
  $("#fab").onclick = () => S.view === "plan" ? openPlanPicker(weekOf(todayKey()) === (S.planWeek || weekOf(todayKey())) ? todayKey() : S.planWeek) : S.view === "book" && S.books.has(S.openBook) ? openImport(S.openBook, "photos") : openImport("__new", "photos");
  // theme: Auto follows the phone, Light and Dark override it (set on the Settings screen)
  const applyTheme = m => { if (m === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = m; };
  let theme = "auto"; try { theme = localStorage.getItem("ci-theme") || "auto"; } catch {}
  applyTheme(theme);
  $("#settingsBtn").onclick = () => { if (S.view !== "settings") S.prevView = { view: S.view, openBook: S.openBook, openRecipe: S.openRecipe }; S.view = "settings"; render(); window.scrollTo(0, 0); };
  main.addEventListener("click", e => {
    const act = e.target.closest("[data-act]");
    if (act) {
      const a = act.dataset.act;
      if (a === "import") openImport(act.dataset.book || null, "photos");
      else if (a === "add") openAdd(act.dataset.book || null, act.dataset.prefill);
      else if (a === "editbook") openEditBook(act.dataset.book);
      else if (a === "cover") { if (S.covers.has(act.dataset.book)) openEditBook(act.dataset.book); else openCover(act.dataset.book); }
      else if (a === "shelf") { S.view = "shelf"; render(); }
      else if (a === "bq-clear") { S.bookQ = ""; const el = main.querySelector("#bq"); if (el) { el.value = ""; el.dispatchEvent(new Event("input")); el.focus(); } }
      else if (a === "mode") { S.shelfMode = act.dataset.v; render(); }
      else if (a === "back") { const bk = S.back || { view: "book", openBook: S.openBook }; Object.assign(S, bk); render(); window.scrollTo(0, 0); }
      else if (a === "openbook") go("book");
      else if (a === "rate-book") { const v = +act.dataset.v; writeBook(S.openBook, b => { b.rating = b.rating === v ? 0 : v; }).catch(() => {}); }
      else if (a === "rate") { const v = +act.dataset.v; updRecipe(S.openBook, S.openRecipe, r => { r.rate = r.rate === v ? 0 : v; }); }
      else if (a === "cooked") openCookFlow(S.openBook, S.openRecipe);
      else if (a === "plan-recipe") { const b = S.openBook, r = S.openRecipe; openDaySheet("Add to the meal plan", null, d => planAdd({ day: d, kind: "recipe", b, r })); }
      else if (a === "wk") { const v = +act.dataset.v; S.planWeek = v ? addDays(S.planWeek || weekOf(todayKey()), 7 * v) : weekOf(todayKey()); render(); }
      else if (a === "plan-add") openPlanPicker(act.dataset.day);
      else if (a === "plan-open") go("recipe", { openBook: act.dataset.b, openRecipe: act.dataset.r });
      else if (a === "plan-menu") openEntryMenu(act.dataset.id);
      else if (a === "made-yes") answerMade(act.dataset.id, true);
      else if (a === "made-no") answerMade(act.dataset.id, false);
      else if (a === "plan-move") { const e = planFind(act.dataset.id); if (e) openDaySheet("Move to…", e.day, d => planMove(e.id, d)); }
      else if (a === "q-up") { const i = +act.dataset.v; const l = quickTypes().map(x => ({ ...x })); if (i > 0) { [l[i - 1], l[i]] = [l[i], l[i - 1]]; saveQuick(l); } }
      else if (a === "q-rm") { const i = +act.dataset.v; const l = quickTypes().map(x => ({ ...x })); if (l.length > 1) { l.splice(i, 1); saveQuick(l); } else toast("Keep at least one"); }
      else if (a === "q-add") { const l = quickTypes().map(x => ({ ...x })); const pal = ["#ffc94a", "#5a4df5", "#ff876d", "#3dbe8b", "#2f9bff", "#e85d9b", "#111214"]; l.push({ id: rid8(), label: "New entry", color: pal[l.length % pal.length] }); saveQuick(l); }
      else if (a === "to-tags") document.getElementById("tags")?.scrollIntoView({ behavior: "smooth", block: "start" });
      else if (a === "note-rm") removeNote(S.openBook, S.openRecipe, act.dataset.v, act.dataset.priv === "1");
      else if (a === "photo-rm") { const id = S.openRecipe; S.photos.delete(id); updRecipe(S.openBook, id, r => { delete r.ph; delete r.tone; }); S.db.doc("photos/" + id).delete().catch(() => {}); }
      else if (a === "theme") { theme = act.dataset.v; applyTheme(theme); try { localStorage.setItem("ci-theme", theme); } catch {} render(); }
      else if (a === "export-prep") exportPrep();
      else if (a === "export-copy") { const box = document.getElementById("exportbox"); box.select(); let ok = false; try { navigator.clipboard.writeText(S.exportText).then(() => { const st = document.getElementById("exportst"); if (st) st.textContent = "Copied. Paste it into the new version's Settings."; }, () => { ok = document.execCommand("copy"); }); } catch { ok = document.execCommand("copy"); } }
      else if (a === "settings-back") { Object.assign(S, S.prevView || { view: "search" }); render(); window.scrollTo(0, 0); }
      else if (a === "uncook") updRecipe(S.openBook, S.openRecipe, r => { r.cooked = (r.cooked || []).slice(0, -1); });
      else if (a === "fav") updRecipe(S.openBook, S.openRecipe, r => { r.fav = !r.fav; });
      else if (a === "tag-ok") { const v = act.dataset.v; updRecipe(S.openBook, S.openRecipe, r => { r.tags = [...new Set([...(r.tags || []), v])]; r.tagsG = (r.tagsG || []).filter(t => t !== v); }); }
      else if (a === "tag-rm") { const v = act.dataset.v; updRecipe(S.openBook, S.openRecipe, r => { r.tags = (r.tags || []).filter(t => t !== v); r.tagsG = (r.tagsG || []).filter(t => t !== v); r.tagsX = [...new Set([...(r.tagsX || []), v])]; }); }
      else if (a === "tag-go") { q.value = act.dataset.v; go("search"); }
      else if (a === "editrecipe") openAdd(S.openBook, null, S.openRecipe);
      else if (a === "recipe-photo") { const bid = S.openBook, rid2 = S.openRecipe; const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*"; inp.multiple = true; inp.onchange = () => { if (inp.files.length) readRecipePhoto(bid, rid2, inp.files); }; inp.click(); }
      else if (a === "suggest-tags") {
        const bid = act.dataset.book; act.disabled = true; const st = document.getElementById("bkst"); if (st) st.textContent = "Suggesting tags… (about a minute per 60 recipes)";
        suggestTags(bid).then(n => toast(n ? `Suggested tags for ${plural(n, "recipe")}` : "No new tags to suggest")).catch(e => toast(SAMPLE_COPY[e?.code] || "Couldn't suggest tags right now")).finally(() => { const el = document.getElementById("bkst"); if (el) el.textContent = ""; });
      }
      return;
    }
    const open = e.target.closest("[data-open]");
    if (open) { if (S.openBook !== open.dataset.open) S.bookQ = ""; S.view = "book"; S.openBook = open.dataset.open; render(); window.scrollTo(0, 0); return; }
    const row = e.target.closest(".row");
    if (row) go("recipe", { openBook: row.dataset.book, openRecipe: row.dataset.rid });
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && sheet.classList.contains("on")) closeSheet();
    if (e.key === "/" && document.activeElement === document.body) { e.preventDefault(); q.focus(); }
  });

  // ---------- boot ----------
  render();
  (async () => {
    if (!window.claude?.use) { S.loaded = true; banner("Open this from its claude.ai link to load the shared index."); render(); return; }
    const [db, user, sample] = await Promise.all([claude.use("db"), claude.use("user").catch(() => null), claude.use("sample").catch(() => null)]);
    if (!db) { S.loaded = true; banner("Sign in to claude.ai to see the shared index."); render(); return; }
    S.db = db; S.sample = sample;
    if (sample) S.limits = await sample.limits().catch(() => null);
    try { const w = user ? await user.can("data.write") : null; if (w === false) S.canWrite = false; } catch {}
    S.user = user;
    try { S.uid = user ? await user.id() : null; S.isOwner = user ? !!(await user.isOwner()) : false; } catch { S.uid = null; }
    if (S.uid) db.doc(`data/users/${S.uid}/recent`).onSnapshot(d => { const v = d.exists ? d.data().v : null; if (Array.isArray(v)) { S.recent = v.filter(x => x && x.b && x.r).slice(0, 20); render(); } }, () => {});
    else { try { S.recent = JSON.parse(localStorage.getItem("ci-recent") || "[]"); } catch {} }
    db.collection("plan").onSnapshot(snap => {
      S.plan = new Map(snap.docs.filter(d => d.exists && /^\d{4}-\d\d-\d\d$/.test(d.id)).map(d => [d.id, Array.isArray(d.data().entries) ? d.data().entries : []]));
      render();
    }, () => {});
    db.doc("meta/plan").onSnapshot(d => { const v = d.exists ? d.data().quick : null; S.quick = Array.isArray(v) && v.length ? v : null; render(); }, () => {});
    if (S.uid) db.doc(`data/users/${S.uid}/notes`).onSnapshot(d => { S.myNotes = d.exists ? (d.data().r || {}) : {}; render(); }, () => {});
    const timer = setTimeout(() => { if (!S.loaded) { S.loaded = true; render(); } banner("Can't reach the index yet. It will fill in once the connection comes back."); }, 10000);
    try { S.shelfSort = localStorage.getItem("ci-sort") || "title"; } catch {}
    db.collection("covers").onSnapshot(snap => {
      S.covers = new Map(snap.docs.filter(d => d.exists && /^data:image\/(jpeg|png|webp);base64,/.test(String(d.data().src || ""))).map(d => [d.id, d.data().src]));
      render();
    }, () => {});
    db.collection("books").onSnapshot(snap => {
      S.books = new Map(snap.docs.filter(d => d.exists).map(d => [d.id, d.data()]));
      if (!snap.metadata.fromCache) { clearTimeout(timer); banner(""); }
      S.loaded = true; render();
    }, err => {
      clearTimeout(timer); S.loaded = true;
      banner(err?.code === "revoked" ? "This page no longer has access to the index." : "Lost the connection to the index. Reload to reconnect.");
      render();
    });
  })();
})();
</script>
</body>
